name: Deploy

# main에 병합되면 웹을 빌드해 S3에 올리고 CloudFront 캐시를 비운다.
# 인프라(Terraform) 변경은 여기서 하지 않는다. 사람이 로컬 SSO로 plan · apply한다 (ADR 0006).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC 토큰 발급 (AWS 임시 자격 증명용)

# 배포는 한 번에 하나씩, 진행 중인 배포는 끊지 않는다
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # production Environment: main 브랜치만 배포 가능. AWS 배포 역할은 이 Environment의 작업만 맡을 수 있다
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 해시가 붙은 정적 파일(_next/static)은 내용이 바뀌면 파일명이 바뀌므로 1년 캐시
      - name: upload static assets
        run: >
          aws s3 sync out/_next/static "s3://${{ vars.SITE_BUCKET }}/_next/static"
          --delete
          --cache-control "public, max-age=31536000, immutable"

      # HTML 등 나머지는 매번 새로 확인하도록 캐시하지 않는다
      - name: upload pages
        run: >
          aws s3 sync out "s3://${{ vars.SITE_BUCKET }}"
          --delete
          --exclude "_next/static/*"
          --cache-control "public, max-age=0, must-revalidate"

      - name: invalidate CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
          --query "Invalidation.Id"
          --output text
