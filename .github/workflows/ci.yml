name: CI

on:
  pull_request:
    branches: [main]

# PR 검사는 AWS에 접근하지 않는다. 읽기 권한만 준다.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      # 서드파티 Action은 태그 대신 커밋 SHA로 고정한다 (태그는 바뀔 수 있음)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8

      - name: fmt
        run: terraform fmt -check -recursive -diff infra

      - name: validate (bootstrap)
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: validate (envs/prod)
        working-directory: infra/envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # lockfile 그대로 설치. 설치 스크립트는 package.json allowScripts 기준으로만 실행된다
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
