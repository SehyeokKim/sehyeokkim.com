version: 2
updates:
  # 커밋 SHA로 고정한 GitHub Action의 새 버전을 주 1회 PR로 알린다
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Terraform provider 버전(.terraform.lock.hcl)
  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule:
      interval: weekly
    commit-message:
      prefix: infra

  # 웹 의존성 (Next.js · React 등)
  # 마이너 · 패치(보안 패치 대부분)와 메이저를 다른 PR로 나눈다.
  # 메이저는 깨지는 변경이 있을 수 있어, 하나가 실패해도 마이너 · 패치 업데이트가 막히지 않게 한다.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      web-major:
        patterns: ["*"]
        update-types: ["major"]
